plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    
    // ADDED: Apply the Google Services Plugin
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.chitfund'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.chitfund"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ADDED: Firebase Bill of Materials (BoM) Platform Control
    implementation platform('com.google.firebase:firebase-bom:34.15.0')

    // ADDED: Cloud Firestore Native Android Library SDK
    implementation 'com.google.firebase:firebase-firestore'
}
